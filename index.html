<!DOCTYPE html>

<html lang="en">
	<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="design.css">
        
        <title>WyneCalc</title>
    </head>

	<body id="interface">
        <audio id="secretSong" src="springsnow.mp3" loop></audio>
        
        <div class="secret-message" id="secretMessage">
            <img id="pic" src="together.jpg">
            <h1 id="secrettext"> HAPPY MONTHSARY LOVEEE!!</h1>
        </div>

        <div id="hearts"></div>
        
        <div class="calc-parent">
            <div class="display">
                <h1 Id="calcInput">0</h1>
            </div>

            <div class="buttons">
                <button class="calcbuttons" id="button-clear">C</button>
                <button class="calcbuttons" id="button-%">%</button>
                <button class="calcbuttons" id="button-back">&lt;-</button>
                <button class="calcbuttons calcbuttonsOp" id="button-divide">/</button>

                <button class="calcbuttons" id="button-7">7</button>
                <button class="calcbuttons" id="button-8">8</button>
                <button class="calcbuttons" id="button-9">9</button>
                <button class="calcbuttons calcbuttonsOp" id="button-plus">+</button>

                <button class="calcbuttons" id="button-4">4</button>
                <button class="calcbuttons" id="button-5">5</button>
                <button class="calcbuttons" id="button-5">6</button>
                <button class="calcbuttons calcbuttonsOp" id="button-minus">-</button>

                <button class="calcbuttons" id="button-1">1</button>
                <button class="calcbuttons" id="button-2">2</button>
                <button class="calcbuttons" id="button-3">3</button>
                <button class="calcbuttons calcbuttonsOp" id="button-mul">X</button>

                <button class="calcbuttons" id="button-parentheses">()</button>
                <button class="calcbuttons" id="button-0">0</button>
                <button class="calcbuttons" id="button-dot">.</button>
                <button class="calcbuttons" id="button-equals">=</button>
            </div>
        </div>

        <script type="text/javascript" src="scrpt.js"></script>
    </body>
</html>
